<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EXCLUSIVE — Admin</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#0d1b33;--mut:#5a6b88;--ac:#2f6df6;--bd:#d9e1ef;--danger:#b3261e;--ok:#137333}
@media(prefers-color-scheme:dark){:root{--bg:#08101f;--card:#0f1c35;--tx:#e8eefb;--mut:#8fa3c6;--ac:#4f86ff;--bd:#1d2e50}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
label{font-size:13px;color:var(--mut);display:block;margin-top:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:600 14px system-ui;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd);padding:10px 0;flex-wrap:wrap}
.it img,.it .x{width:70px;height:52px;object-fit:cover;border-radius:8px;background:var(--bd)}
.it .t{flex:1;min-width:200px}
.hid{display:none!important}
.m{color:var(--mut);font-size:13px}
.msg{min-height:20px}
.ok{color:var(--ok)}
.err{color:var(--danger)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--bd);padding:7px;text-align:left;vertical-align:top}
.preview img{max-width:180px;max-height:140px;border-radius:10px;border:1px solid var(--bd)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
@media(max-width:600px){main{padding:10px}.top{align-items:flex-start}.it .t{min-width:160px}}
</style>
</head>
<body>
<main>

<section class="box" id="loginBox">
  <h2 id="loginTitle">Admin kirish</h2>

  <div id="setupKeyWrap" class="hid">
    <label for="setupKey">Sozlash kaliti (Netlify Environment Variables dagi SETUP_KEY)</label>
    <input id="setupKey" type="password" autocomplete="off">
  </div>

  <label for="username">Login</label>
  <input id="username" autocomplete="username">

  <label for="password">Parol</label>
  <input id="password" type="password" autocomplete="current-password">

  <div id="password2Wrap" class="hid">
    <label for="password2">Parolni takrorlang (kamida 10 belgi)</label>
    <input id="password2" type="password" autocomplete="new-password">
  </div>

  <div class="row">
    <button class="btn" id="loginBtn" type="button">Kirish</button>
    <span id="loginMsg" class="m msg"></span>
  </div>

  <div class="m" style="margin-top:8px">
    <a href="/api/health" target="_blank" rel="noopener">Tizim holati (/api/health)</a>
  </div>
</section>

<section id="app" class="hid">
  <div class="top">
    <h2>EXCLUSIVE admin</h2>
    <div>
      <a href="/" class="m">Saytga</a> ·
      <button class="btn s" id="logoutBtn" type="button">Chiqish</button>
    </div>
  </div>

  <div class="box">
    <h2>Mahsulot qo‘shish / tahrirlash</h2>
    <input type="hidden" id="productId">
    <input type="hidden" id="productTs">

    <label for="name">Nomi</label>
    <input id="name" maxlength="120">

    <label for="car">Avtomobil modeli</label>
    <input id="car" maxlength="80" placeholder="Nexia 3">

    <label for="cat">Kategoriya</label>
    <input id="cat" list="categoryList" maxlength="60" placeholder="Masalan: To‘qima, Eko-charm">
    <datalist id="categoryList"></datalist>

    <label for="desc">Tavsif</label>
    <textarea id="desc" rows="4" maxlength="2000" placeholder="Material, rang, qulayliklar…"></textarea>

    <label for="price">Narx (so‘m)</label>
    <input id="price" type="number" min="0" step="1">

    <label>Rasm</label>
    <input id="file" type="file" accept="image/*">
    <div id="preview" class="preview"></div>
    <div class="m">Rasmni tanlash, nusxalash yoki shu sahifaga tashlash mumkin.</div>

    <label>
      <input type="checkbox" id="visible" checked>
      Katalogda ko‘rsatish
    </label>

    <div class="row" style="margin-top:10px">
      <button class="btn" id="saveProductBtn" type="button">Saqlash</button>
      <button class="btn s" id="resetProductBtn" type="button">Tozalash</button>
      <span id="productMsg" class="m msg"></span>
    </div>
  </div>

  <div class="box">
    <h2>Mahsulotlar</h2>
    <div id="productList"><span class="m">Yuklanmoqda…</span></div>
  </div>

  <div class="box">
    <h2>Buyurtmalar</h2>
    <div class="tbl" id="orderList"><span class="m">Yuklanmoqda…</span></div>
  </div>

  <div class="box">
    <h2>Admin hisobi</h2>
    <label for="currentPassword">Hozirgi parol</label>
    <input id="currentPassword" type="password" autocomplete="current-password">

    <label for="newPassword">Yangi parol (kamida 10 belgi)</label>
    <input id="newPassword" type="password" autocomplete="new-password">

    <button class="btn" id="changePasswordBtn" type="button">Parolni o‘zgartirish</button>
    <span id="passwordMsg" class="m msg"></span>
  </div>

  <div class="box">
    <h2>Aloqa va ma’lumotlar</h2>
    <label for="settingsPhone">Telefon</label>
    <input id="settingsPhone">

    <label for="settingsTelegram">Telegram (@username)</label>
    <input id="settingsTelegram">

    <label for="settingsInstagram">Instagram (@username)</label>
    <input id="settingsInstagram">

    <label for="settingsDelivery">Yetkazib berish haqida</label>
    <textarea id="settingsDelivery" rows="3"></textarea>

    <label for="settingsHowto">Buyurtma tartibi</label>
    <textarea id="settingsHowto" rows="3"></textarea>

    <button class="btn" id="saveSettingsBtn" type="button">Saqlash</button>
    <span id="settingsMsg" class="m msg"></span>
  </div>
</section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

let token = sessionStorage.getItem("exclusive_admin_token") || "";
let products = [];
let imageData = "";
let setupMode = false;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[ch]));
}

function setMsg(id, text, ok = false) {
  const el = $(id);
  el.textContent = text || "";
  el.className = "m msg " + (ok ? "ok" : text ? "err" : "");
}

async function api(path, method = "GET", body) {
  const options = {
    method,
    headers: {
      "Accept": "application/json",
      "Content-Type": "application/json"
    }
  };

  if (token) options.headers.Authorization = "Bearer " + token;
  if (body !== undefined) options.body = JSON.stringify(body);

  let response;
  try {
    response = await fetch("/api/" + path.replace(/^\/+/, ""), options);
  } catch {
    throw new Error("Serverga ulanib bo‘lmadi. /api/health manzilini tekshiring.");
  }

  const data = await response.json().catch(() => ({}));

  if (response.status === 401 && !["login","setup"].includes(path.split("?")[0])) {
    logout(false);
    throw new Error("Sessiya tugagan. Qayta kiring.");
  }

  if (!response.ok) {
    throw new Error(data.error || ("Server xatosi: " + response.status));
  }

  return data;
}

function showApp() {
  $("loginBox").classList.toggle("hid", !!token);
  $("app").classList.toggle("hid", !token);
  if (token) loadAll();
}

async function init() {
  try {
    const health = await api("health");

    setupMode = !health.adminExists;

    $("loginTitle").textContent = setupMode
      ? "Admin hisobini yaratish"
      : "Admin kirish";

    $("setupKeyWrap").classList.toggle("hid", !setupMode);
    $("password2Wrap").classList.toggle("hid", !setupMode);
    $("loginBtn").textContent = setupMode ? "Hisob yaratish" : "Kirish";

    if (health.db && health.db !== "ok") {
      setMsg("loginMsg", "Ma’lumotlar bazasi: " + health.db);
    } else if (health.setupKeySet === false && setupMode) {
      setMsg("loginMsg", "Netlify'da SETUP_KEY o‘rnatilmagan.");
    }

    showApp();
  } catch (error) {
    setMsg("loginMsg", error.message);
    $("loginTitle").textContent = "Admin serveriga ulanib bo‘lmadi";
  }
}

async function login() {
  setMsg("loginMsg", "");

  const username = $("username").value.trim();
  const password = $("password").value;

  try {
    if (username.length < 3) throw new Error("Login kamida 3 belgi bo‘lsin.");
    if (password.length < 10) throw new Error("Parol kamida 10 belgi bo‘lsin.");

    if (setupMode) {
      if ($("password2").value !== password) {
        throw new Error("Parollar mos emas.");
      }

      const result = await api("setup", "POST", {
        key: $("setupKey").value,
        username,
        password
      });

      token = result.token;
    } else {
      const result = await api("login", "POST", {
        username,
        password
      });

      token = result.token;
    }

    sessionStorage.setItem("exclusive_admin_token", token);
    $("password").value = "";
    $("password2").value = "";
    $("setupKey").value = "";
    showApp();
  } catch (error) {
    setMsg("loginMsg", error.message);
  }
}

function logout(showMessage = true) {
  token = "";
  sessionStorage.removeItem("exclusive_admin_token");
  $("app").classList.add("hid");
  $("loginBox").classList.remove("hid");
  if (showMessage) setMsg("loginMsg", "Tizimdan chiqildi.", true);
}

function resetProduct() {
  $("productId").value = "";
  $("productTs").value = "";
  $("name").value = "";
  $("car").value = "";
  $("cat").value = "";
  $("desc").value = "";
  $("price").value = "";
  $("visible").checked = true;
  $("file").value = "";
  imageData = "";
  $("preview").innerHTML = "";
}

function previewImage(src) {
  $("preview").innerHTML = src
    ? '<img src="' + esc(src) + '" alt="Rasm">'
    : "";
}

function editProduct(id) {
  const p = products.find(item => item.id === id);
  if (!p) {
    setMsg("productMsg", "Mahsulot topilmadi.");
    return;
  }

  $("productId").value = p.id || "";
  $("productTs").value = p.ts || "";
  $("name").value = p.name || "";
  $("car").value = p.car || "";
  $("cat").value = p.cat || "";
  $("desc").value = p.desc || "";
  $("price").value = p.price ?? "";
  $("visible").checked = p.visible !== false;
  imageData = p.img || "";
  previewImage(imageData);
  window.scrollTo({top: 0, behavior: "smooth"});
}

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onerror = () => reject(new Error("Rasmni o‘qib bo‘lmadi."));
    reader.onload = () => {
      const img = new Image();

      img.onerror = () => reject(new Error("Rasm formati noto‘g‘ri."));
      img.onload = () => {
        const max = 900;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");

        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };

      img.src = reader.result;
    };

    reader.readAsDataURL(file);
  });
}

async function takeImage(file) {
  if (!file || !file.type.startsWith("image/")) return;

  try {
    imageData = await shrinkImage(file);
    previewImage(imageData);
    setMsg("productMsg", "Rasm tayyor.", true);
  } catch (error) {
    setMsg("productMsg", error.message);
  }
}

async function saveProduct() {
  try {
    setMsg("productMsg", "Saqlanmoqda…");

    const price = Number($("price").value);
    if (!Number.isFinite(price) || price < 0) {
      throw new Error("Narxni to‘g‘ri kiriting.");
    }

    await api("products", "PUT", {
      id: $("productId").value,
      ts: $("productTs").value,
      name: $("name").value,
      car: $("car").value,
      cat: $("cat").value,
      desc: $("desc").value,
      price,
      visible: $("visible").checked,
      img: imageData
    });

    resetProduct();
    setMsg("productMsg", "Mahsulot saqlandi ✓", true);
    await loadProducts();
  } catch (error) {
    setMsg("productMsg", error.message);
  }
}

async function toggleProduct(id) {
  try {
    const p = products.find(item => item.id === id);
    if (!p) throw new Error("Mahsulot topilmadi.");

    await api("products", "PUT", {
      ...p,
      visible: p.visible === false
    });

    await loadProducts();
  } catch (error) {
    setMsg("productMsg", error.message);
  }
}

async function deleteProduct(id) {
  if (!confirm("Mahsulot o‘chirilsinmi?")) return;

  try {
    await api("products?id=" + encodeURIComponent(id), "DELETE");
    await loadProducts();
  } catch (error) {
    setMsg("productMsg", error.message);
  }
}

async function loadProducts() {
  products = await api("products?all=1");

  const categories = [...new Set(products.map(p => p.cat).filter(Boolean))];
  $("categoryList").innerHTML = categories
    .map(c => '<option value="' + esc(c) + '"></option>')
    .join("");

  $("productList").innerHTML = products.length
    ? products.map(p => `
      <div class="it">
        ${p.img
          ? '<img src="' + esc(p.img) + '" alt="">'
          : '<div class="x"></div>'}
        <div class="t">
          <b>${esc(p.name)}</b> · ${esc(p.car)}
          ${p.cat ? " · " + esc(p.cat) : ""}
          <br>
          <span class="m">
            ${Number(p.price || 0).toLocaleString("uz-UZ")} so‘m
            ${p.visible === false ? " · YASHIRIN" : ""}
          </span>
        </div>
        <button class="btn s" type="button" onclick="editProduct('${esc(p.id)}')">Tahrir</button>
        <button class="btn s" type="button" onclick="toggleProduct('${esc(p.id)}')">
          ${p.visible === false ? "Ko‘rsatish" : "Yashirish"}
        </button>
        <button class="btn r" type="button" onclick="deleteProduct('${esc(p.id)}')">O‘chirish</button>
      </div>
    `).join("")
    : '<span class="m">Hozircha mahsulot yo‘q.</span>';
}

async function loadOrders() {
  const orders = await api("orders");

  $("orderList").innerHTML = orders.length
    ? `<table>
        <thead>
          <tr>
            <th>Sana</th><th>Mijoz</th><th>Mahsulot</th><th>Avto</th><th>Manzil / izoh</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td>${esc(new Date(o.ts).toLocaleString("uz-UZ"))}</td>
              <td>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.tg)}</td>
              <td>${esc(o.product)}<br>${esc(o.price)}</td>
              <td>${esc(o.car)} ${esc(o.year)}<br>${esc(o.wish)}</td>
              <td>${esc(o.address)}<br>${esc(o.note)}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>`
    : '<span class="m">Buyurtmalar yo‘q.</span>';
}

async function loadSettings() {
  const settings = await api("settings");

  $("settingsPhone").value = settings.phone || "";
  $("settingsTelegram").value = settings.telegram || "";
  $("settingsInstagram").value = settings.instagram || "";
  $("settingsDelivery").value = settings.delivery || "";
  $("settingsHowto").value = settings.howto || "";
}

async function loadAll() {
  try {
    await Promise.all([loadProducts(), loadOrders(), loadSettings()]);
  } catch (error) {
    setMsg("productMsg", error.message);
  }
}

async function changePassword() {
  try {
    const current = $("currentPassword").value;
    const next = $("newPassword").value;

    if (next.length < 10) throw new Error("Yangi parol kamida 10 belgi bo‘lsin.");

    const result = await api("password", "PUT", {current, next});
    token = result.token;
    sessionStorage.setItem("exclusive_admin_token", token);

    $("currentPassword").value = "";
    $("newPassword").value = "";
    setMsg("passwordMsg", "Parol o‘zgartirildi ✓", true);
  } catch (error) {
    setMsg("passwordMsg", error.message);
  }
}

async function saveSettings() {
  try {
    await api("settings", "PUT", {
      phone: $("settingsPhone").value,
      telegram: $("settingsTelegram").value,
      instagram: $("settingsInstagram").value,
      delivery: $("settingsDelivery").value,
      howto: $("settingsHowto").value
    });

    setMsg("settingsMsg", "Ma’lumotlar saqlandi ✓", true);
  } catch (error) {
    setMsg("settingsMsg", error.message);
  }
}

$("loginBtn").addEventListener("click", login);
$("logoutBtn").addEventListener("click", () => logout(true));
$("saveProductBtn").addEventListener("click", saveProduct);
$("resetProductBtn").addEventListener("click", resetProduct);
$("changePasswordBtn").addEventListener("click", changePassword);
$("saveSettingsBtn").addEventListener("click", saveSettings);
$("file").addEventListener("change", e => takeImage(e.target.files[0]));

$("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

window.addEventListener("paste", e => {
  for (const item of e.clipboardData?.items || []) {
    if (item.type.startsWith("image/")) {
      takeImage(item.getAsFile());
      break;
    }
  }
});

window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  takeImage(e.dataTransfer?.files?.[0]);
});

init();
</script>
</body>
</html>
